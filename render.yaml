services:
  # 1. Private MySQL Database Service
  - type: pserv
    name: ecoscan-mysql
    runtime: image
    image:
      url: mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: S@mpath2562
      - key: MYSQL_DATABASE
        value: ecoscan_db

  # 2. Spring Boot Backend Web Service (Deployed via Docker)
  - type: web
    name: ecoscan-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: jdbc:mysql://ecoscan-mysql:3306/ecoscan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: DATABASE_USER
        value: root
      - key: DATABASE_PASSWORD
        value: S@mpath2562
      # The application is pre-configured to allow any *.onrender.com subdomain CORS origin automatically.
      # You can add custom domains by defining ALLOWED_ORIGINS here or in the Render Dashboard.

  # 3. React Frontend Static Site
  - type: web
    name: ecoscan-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Change the value below if you rename the backend service during Blueprint creation.
      # Format: https://[backend-service-name].onrender.com
      - key: VITE_API_URL
        value: https://ecoscan-backend.onrender.com

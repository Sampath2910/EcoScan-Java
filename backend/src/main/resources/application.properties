# ========================================
# EcoScan Backend — application.properties
# ========================================
# NOTE: Use environment variables for sensitive data
# Set these in your environment before running:
#   DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, DATABASE_PORT

# Server
server.port=8080

# MySQL Database - Use Environment Variables (SECURE!)
# Format: jdbc:mysql://host:port/dbname?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ecoscan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Upload Storage Path (relative to where the app is run from)
ecoscan.upload.dir=uploads

# ML Model Cache
ecoscan.model.cache-dir=model_cache
ecoscan.model.ts-url=https://huggingface.co/Sampath2910/EcoScan-Classifier/resolve/main/waste_classifier_scripted.pt?download=true

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax

# CORS Configuration
server.error.include-stacktrace=never
server.error.include-message=always
ecoscan.model.pth-url=https://huggingface.co/Sampath2910/EcoScan-Classifier/resolve/main/waste_classifier_optimized.pth?download=true

